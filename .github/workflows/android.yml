name: Build CallVault APK
on: {workflow_dispatch: {}, push: {branches: [main]}}
jobs:
 build:
  runs-on: ubuntu-latest
  env:
   TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
   TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: "17"}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: "8.10"}
   - name: Build APK
     run: |
      gradle assembleDebug -PTELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" -PTELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID"
   - uses: actions/upload-artifact@v4
     with: {name: CallVault-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk}